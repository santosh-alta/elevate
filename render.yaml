# Render blueprint for the Elevate API (the website runs on Vercel; see docs/DEPLOY.md).
# Render → New → Blueprint → pick this repo. Values marked `sync: false` are asked for on first deploy.
services:
  - type: web
    name: elevate-api
    runtime: node
    region: singapore # same region as the Neon database
    plan: starter # needed for the uploads disk and the pre-deploy migration step
    branch: main
    autoDeploy: true
    # Only rebuild the API when server code changes (website-only pushes don't restart it)
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - package.json
        - package-lock.json
        - render.yaml
    buildCommand: npm ci --include=dev && npm run prisma:generate -w @elevate/api
    preDeployCommand: cd apps/api && npx prisma migrate deploy
    startCommand: npm start -w @elevate/api
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Neon's DIRECT connection string (the one without "-pooler" in the host)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # This service's own address, e.g. https://elevate-api.onrender.com
      - key: API_PUBLIC_URL
        sync: false
      # The website's Vercel address, e.g. https://alta-events.vercel.app
      - key: WEB_PUBLIC_URL
        sync: false
      # Brands point their custom domain at Vercel, which hosts the website
      - key: CNAME_TARGET
        value: cname.vercel-dns.com
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_DIR
        value: /var/data/storage
      - key: DISPLAY_TZ
        value: Asia/Kolkata
      # Email, e.g. smtps://user:pass@smtp.example.com:465 (without it, no emails are sent)
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      # Fallback Razorpay keys (each brand can also set its own in Admin → Settings)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # "Continue with Google" (Google Cloud → APIs & Services → Credentials → OAuth client ID, type "Web application")
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # "Continue with GitHub" (GitHub → Settings → Developer settings → OAuth Apps)
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Optional: AI-written LinkedIn drafts
      - key: ANTHROPIC_API_KEY
        sync: false
      # AI writing help in the event editor (Google AI Studio → API key; free tier)
      - key: GEMINI_API_KEY
        sync: false
      # Optional: AI uses per person per day (default 5) and for brand admins (default 30)
      - key: AI_DAILY_LIMIT
        value: "5"
      - key: AI_ADMIN_DAILY_LIMIT
        value: "30"
      # Backup AI when Gemini is over its free limit or down (console.groq.com → API keys; free tier)
      - key: GROQ_API_KEY
        sync: false
      # Optional: assistant messages per person per day: students (20), organisers/staff (50), HQ admins (200)
      - key: AI_CHAT_DAILY_LIMIT
        value: "20"
      - key: AI_CHAT_STAFF_DAILY_LIMIT
        value: "50"
      - key: AI_CHAT_ADMIN_DAILY_LIMIT
        value: "200"
